<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f5496">
<title>Avoiding the Walker Dip — Research Poster</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eef1f5;color:#172437;font-family:Arial,Helvetica,sans-serif}
.toolbar{position:sticky;top:0;z-index:5;display:flex;justify-content:flex-end;align-items:center;gap:8px;min-height:44px;padding:6px 12px;background:#fff;border-bottom:1px solid #d7dde6}
.toolbar button{min-width:36px;height:32px;padding:0 10px;border:1px solid #bbc5d2;border-radius:4px;background:#fff;color:#183d72;font:700 16px/1 Arial,sans-serif;cursor:pointer}
.toolbar button:hover{background:#edf2f9}.toolbar button:focus-visible{outline:3px solid #f4c84a;outline-offset:1px}.zoom-value{min-width:48px;text-align:center;font-size:13px;font-weight:700}
.viewer{height:calc(100vh - 45px);overflow:auto;overscroll-behavior:contain;text-align:center}
.poster{display:block;width:min(100vw,45in);height:auto;margin:0 auto;max-width:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@page{size:45in 22in;margin:0}
@media print{html,body{width:45in;height:22in;margin:0;padding:0;overflow:hidden;background:#fff}.toolbar{display:none}.viewer{width:45in;height:22in;overflow:visible;text-align:left}.poster{width:45in;height:22in;margin:0;object-fit:fill;print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style>
</head>
<body>
<div class="toolbar" role="toolbar" aria-label="Poster viewing controls">
  <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
  <span class="zoom-value" id="zoom-value" aria-live="polite">100%</span>
  <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
  <button id="zoom-fit" type="button" aria-label="Fit poster to screen">Fit</button>
</div>
<div class="viewer" id="viewer">
  <img id="poster" class="poster" src="assets/walker-dip-poster.png" alt="Treatment of Civilian Upper Extremity Trauma Patients at a Military Level One Trauma Center: Avoiding the Walker Dip. A 45 by 22 inch research poster with background, methods, KSA scoring, results charts, discussion, references, and disclaimer.">
</div>
<p class="sr-only">The poster is shown as a single, high-resolution image to preserve the original text alignment and chart layout. Use the zoom controls to enlarge it on screen. Printed page size is 45 by 22 inches.</p>
<script>
let scale=1;
const poster=document.getElementById('poster'),label=document.getElementById('zoom-value');
function update(){poster.style.width=`${Math.min(window.innerWidth*scale,45*96)}px`;label.textContent=`${Math.round(scale*100)}%`}
document.getElementById('zoom-in').addEventListener('click',()=>{scale=Math.min(2.5,scale+.25);update()});
document.getElementById('zoom-out').addEventListener('click',()=>{scale=Math.max(1,scale-.25);update()});
document.getElementById('zoom-fit').addEventListener('click',()=>{scale=1;update()});
window.addEventListener('resize',update);update();
</script>
</body>
</html>
